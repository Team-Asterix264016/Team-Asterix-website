<!doctype html>
<!-- No `scroll-smooth` here: Lenis drives smooth scrolling in JS, and a CSS
     scroll-behavior on the root fights it (and ScrollTrigger) on every
     anchor jump. -->
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=7" />
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=7" />
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=7" />
        <link rel="shortcut icon" type="image/svg+xml" href="/favicon.svg?v=7" />
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=7" />
        <!-- viewport-fit=cover is required for env(safe-area-inset-*) to resolve to anything
             other than 0px. The mobile nav dock is fixed to the bottom edge and has to
             clear the iPhone home indicator. -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <title>Team Asterix | Autonomous Mobility & Advanced Engineering</title>
        <meta
            name="description"
            content="Official website of Team Asterix — Next-generation autonomous mobility, off-road vehicle systems, and high-performance robotics engineering at PSG iTech."
        />

        <!-- Open Graph / WhatsApp / Facebook / LinkedIn Link Preview -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Team Asterix" />
        <meta property="og:title" content="Team Asterix | Autonomous Mobility & Advanced Engineering" />
        <meta
            property="og:description"
            content="Official website of Team Asterix — Next-generation autonomous mobility, off-road vehicle systems, and high-performance robotics engineering."
        />
        <meta property="og:image" content="/og-image.png?v=2" />
        <meta property="og:image:secure_url" content="/og-image.png?v=2" />
        <meta property="og:image:type" content="image/png" />
        <meta property="og:image:width" content="1254" />
        <meta property="og:image:height" content="1254" />
        <meta property="og:image:alt" content="Team Asterix Official Logo" />

        <!-- Twitter / X Link Preview -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Team Asterix | Autonomous Mobility & Advanced Engineering" />
        <meta
            name="twitter:description"
            content="Official website of Team Asterix — Next-generation autonomous mobility, off-road vehicle systems, and high-performance robotics engineering."
        />
        <meta name="twitter:image" content="/og-image.png?v=2" />
        <meta name="twitter:image:alt" content="Team Asterix Official Logo" />

        <!-- Structured Data JSON-LD for Search Engines & AI Models -->
        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "EducationalOrganization",
                "name": "Team Asterix",
                "url": "https://asterix-website.vercel.app",
                "logo": "https://asterix-website.vercel.app/og-image.png",
                "description": "Official website of Team Asterix — Next-generation autonomous mobility, off-road vehicle systems, and high-performance robotics engineering at PSG iTech.",
                "sameAs": [
                    "https://www.instagram.com/asterix_itech/",
                    "https://www.linkedin.com/company/teamasterix/",
                    "https://github.com/Team-Asterix264016/"
                ]
            }
        </script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
    </head>
    <!-- Utilities outrank the `@layer base` body rule, so this dark pairing was
       winning: the page flashed near-black with white text before React
       mounted, and any text outside an explicitly coloured container inherited
       white on white. The site is a light theme. -->
    <body class="bg-white text-slate-900 antialiased">
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
